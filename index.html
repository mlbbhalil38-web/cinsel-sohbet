<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinsel Sohbet</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1020;
  color:#fff;
  min-height:100vh;
}

header{
  height:65px;
  background:#11182b;
  border-bottom:1px solid #29324a;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.logo span{
  color:#ff4f81;
}

.menu-btn{
  background:#1b2439;
  border:1px solid #34405c;
  color:#fff;
  border-radius:10px;
  padding:10px 14px;
  font-size:20px;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.welcome{
  text-align:center;
  padding:35px 15px 25px;
}

.welcome h1{
  font-size:30px;
  margin-bottom:10px;
}

.welcome p{
  color:#aab3c7;
  font-size:15px;
}

.login-box{
  max-width:430px;
  margin:20px auto;
  background:#11182b;
  border:1px solid #293550;
  border-radius:18px;
  padding:25px;
}

.login-box h2{
  text-align:center;
  margin-bottom:20px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#b9c2d5;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #34405c;
  background:#0b1020;
  color:#fff;
  outline:none;
  margin-bottom:15px;
  font-size:15px;
}

input:focus{
  border-color:#ff4f81;
}

button{
  cursor:pointer;
}

.login-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#ff4f81;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.login-btn:active{
  transform:scale(.98);
}

.chat-area{
  display:none;
}

.chat-layout{
  display:grid;
  grid-template-columns:230px 1fr;
  gap:15px;
}

.rooms,
.chat-box{
  background:#11182b;
  border:1px solid #293550;
  border-radius:15px;
}

.rooms{
  padding:15px;
}

.rooms h3{
  margin-bottom:15px;
}

.room{
  padding:12px;
  margin-bottom:8px;
  background:#1a2338;
  border-radius:9px;
  color:#cbd2e2;
}

.room.active{
  background:#ff4f81;
  color:#fff;
}

.chat-box{
  min-height:550px;
  display:flex;
  flex-direction:column;
}

.chat-header{
  padding:15px;
  border-bottom:1px solid #293550;
  font-weight:bold;
}

.messages{
  flex:1;
  padding:15px;
  overflow-y:auto;
  min-height:400px;
}

.message{
  background:#1a2338;
  border-radius:10px;
  padding:10px;
  margin-bottom:10px;
}

.message .name{
  color:#ff6d96;
  font-weight:bold;
  margin-bottom:4px;
}

.chat-input{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #293550;
}

.chat-input input{
  margin:0;
}

.send-btn{
  width:55px;
  border:0;
  border-radius:10px;
  background:#ff4f81;
  color:white;
  font-size:20px;
}

.online{
  margin-top:15px;
  color:#9da8bd;
  font-size:13px;
}

.logout{
  margin-top:15px;
  padding:10px 15px;
  background:#252e43;
  color:white;
  border:1px solid #39445e;
  border-radius:8px;
}

@media(max-width:700px){
  .chat-layout{
    grid-template-columns:1fr;
  }

  .rooms{
    display:flex;
    gap:8px;
    overflow-x:auto;
  }

  .rooms h3{
    display:none;
  }

  .room{
    min-width:120px;
    margin:0;
    text-align:center;
  }

  .chat-box{
    min-height:500px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    <span>♥</span> Cinsel Sohbet
  </div>

  <button class="menu-btn">
    ☰
  </button>

</header>


<div class="container">

  <section class="welcome">

    <h1>Hoş Geldin 👋</h1>

    <p>
      Sohbete katılmak için kullanıcı adını gir.
    </p>

  </section>


  <!-- GİRİŞ -->

  <section id="loginArea" class="login-box">

    <h2>Sohbete Katıl</h2>

    <label>Kullanıcı Adı</label>

    <input
      id="username"
      type="text"
      maxlength="20"
      placeholder="Kullanıcı adın"
    >

    <button
      class="login-btn"
      onclick="login()"
    >
      Sohbete Gir
    </button>

  </section>


  <!-- CHAT -->

  <section id="chatArea" class="chat-area">

    <div class="chat-layout">


      <div class="rooms">

        <h3>Odalar</h3>

        <div class="room active">
          Genel Sohbet
        </div>

        <div class="room">
          Tanışma
        </div>

        <div class="room">
          Gece Sohbeti
        </div>

        <div class="online">
          🟢 Online: <span id="onlineCount">1</span>
        </div>

        <button
          class="logout"
          onclick="logout()"
        >
          Çıkış Yap
        </button>

      </div>


      <div class="chat-box">

        <div class="chat-header">
          💬 Genel Sohbet
        </div>


        <div
          id="messages"
          class="messages"
        >

          <div class="message">

            <div class="name">
              Sistem
            </div>

            Sohbete hoş geldin! 👋

          </div>

        </div>


        <div class="chat-input">

          <input
            id="messageInput"
            type="text"
            placeholder="Mesajını yaz..."
            maxlength="500"
            onkeydown="handleEnter(event)"
          >

          <button
            class="send-btn"
            onclick="sendMessage()"
          >
            ➤
          </button>

        </div>

      </div>

    </div>

  </section>

</div>


<script>

let currentUsername = "";


/* =========================
   GİRİŞ
========================= */

function login(){

  const input =
    document.getElementById("username");

  const username =
    input.value.trim();

  if(!username){

    alert("Lütfen kullanıcı adı gir.");

    return;
  }

  currentUsername =
    username;

  localStorage.setItem(
    "username",
    username
  );

  document.getElementById(
    "loginArea"
  ).style.display = "none";

  document.getElementById(
    "chatArea"
  ).style.display = "block";

}


/* =========================
   ÇIKIŞ
========================= */

function logout(){

  localStorage.removeItem(
    "username"
  );

  currentUsername = "";

  location.reload();

}


/* =========================
   MESAJ GÖNDER
========================= */

function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if(!text){

    return;
  }

  const messages =
    document.getElementById(
      "messages"
    );


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "name";

  name.textContent =
    currentUsername;


  const content =
    document.createElement(
      "div"
    );

  content.textContent =
    text;


  message.appendChild(
    name
  );

  message.appendChild(
    content
  );


  messages.appendChild(
    message
  );


  input.value = "";

  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================
   ENTER
========================= */

function handleEnter(event){

  if(event.key === "Enter"){

    sendMessage();

  }

}


/* =========================
   SAYFA AÇILIŞ
========================= */

window.addEventListener(
  "load",
  function(){

    const savedUsername =
      localStorage.getItem(
        "username"
      );


    if(savedUsername){

      currentUsername =
        savedUsername;

      document.getElementById(
        "loginArea"
      ).style.display = "none";

      document.getElementById(
        "chatArea"
      ).style.display = "block";

    }

  }
);

</script>

</body>
</html>
