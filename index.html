<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Cinsel Sohbet</title>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1020;
  color:#fff;
  min-height:100vh;
}

header{
  height:65px;
  background:#11182b;
  border-bottom:1px solid #29324a;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.logo span{
  color:#ff4f81;
}

.menu-btn{
  background:#1b2439;
  border:1px solid #34405c;
  color:#fff;
  border-radius:10px;
  padding:10px 14px;
  font-size:20px;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.welcome{
  text-align:center;
  padding:35px 15px 25px;
}

.welcome h1{
  font-size:30px;
  margin-bottom:10px;
}

.welcome p{
  color:#aab3c7;
  font-size:15px;
}

.login-box{
  max-width:430px;
  margin:20px auto;
  background:#11182b;
  border:1px solid #293550;
  border-radius:18px;
  padding:25px;
}

.login-box h2{
  text-align:center;
  margin-bottom:20px;
}

label{
  display:block;
  margin-bottom:7px;
  color:#b9c2d5;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #34405c;
  background:#0b1020;
  color:#fff;
  outline:none;
  margin-bottom:15px;
  font-size:15px;
}

input:focus{
  border-color:#ff4f81;
}

button{
  cursor:pointer;
}

.login-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#ff4f81;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.login-btn:active{
  transform:scale(.98);
}

.chat-area{
  display:none;
}

.chat-layout{
  display:grid;
  grid-template-columns:230px 1fr;
  gap:15px;
}

.rooms,
.chat-box{
  background:#11182b;
  border:1px solid #293550;
  border-radius:15px;
}

.rooms{
  padding:15px;
}

.rooms h3{
  margin-bottom:15px;
}

.room{
  padding:12px;
  margin-bottom:8px;
  background:#1a2338;
  border-radius:9px;
  color:#cbd2e2;
  cursor:pointer;
  transition:.2s;
}

.room:hover{
  background:#252f48;
}

.room.active{
  background:#ff4f81;
  color:#fff;
}

.chat-box{
  min-height:550px;
  display:flex;
  flex-direction:column;
}

.chat-header{
  padding:15px;
  border-bottom:1px solid #293550;
  font-weight:bold;
}

.messages{
  flex:1;
  padding:15px;
  overflow-y:auto;
  min-height:400px;
}

.message{
  background:#1a2338;
  border-radius:10px;
  padding:10px;
  margin-bottom:10px;
  word-break:break-word;
}

.message .name{
  color:#ff6d96;
  font-weight:bold;
  margin-bottom:4px;
}

.message .time{
  color:#727d94;
  font-size:11px;
  margin-top:5px;
}

.chat-input{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #293550;
}

.chat-input input{
  margin:0;
}

.send-btn{
  width:55px;
  border:0;
  border-radius:10px;
  background:#ff4f81;
  color:white;
  font-size:20px;
}

.online{
  margin-top:15px;
  color:#9da8bd;
  font-size:13px;
}

.logout{
  margin-top:15px;
  padding:10px 15px;
  background:#252e43;
  color:white;
  border:1px solid #39445e;
  border-radius:8px;
  width:100%;
}

.status{
  text-align:center;
  color:#ff6d96;
  font-size:13px;
  margin-top:10px;
  min-height:18px;
}

.empty{
  text-align:center;
  color:#78839a;
  padding:30px 10px;
}

@media(max-width:700px){

  .chat-layout{
    grid-template-columns:1fr;
  }

  .rooms{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px;
  }

  .rooms h3{
    display:none;
  }

  .room{
    min-width:110px;
    margin:0;
    text-align:center;
  }

  .online{
    min-width:100px;
    margin:auto 0;
  }

  .logout{
    min-width:90px;
    margin:0;
  }

  .chat-box{
    min-height:500px;
  }

}

</style>

</head>


<body>


<header>

  <div class="logo">
    <span>♥</span> Cinsel Sohbet
  </div>

  <button
    class="menu-btn"
    onclick="alert('Menü yakında aktif olacak.')"
  >
    ☰
  </button>

</header>



<div class="container">


  <section class="welcome">

    <h1>Hoş Geldin 👋</h1>

    <p>
      Sohbete katılmak için kullanıcı adını gir.
    </p>

  </section>



  <!-- GİRİŞ -->

  <section
    id="loginArea"
    class="login-box"
  >

    <h2>Sohbete Katıl</h2>

    <label>Kullanıcı Adı</label>

    <input
      id="username"
      type="text"
      maxlength="20"
      placeholder="Kullanıcı adın"
      autocomplete="off"
    >

    <button
      class="login-btn"
      onclick="login()"
    >
      Sohbete Gir
    </button>

    <div
      id="loginStatus"
      class="status"
    ></div>

  </section>



  <!-- CHAT -->

  <section
    id="chatArea"
    class="chat-area"
  >

    <div class="chat-layout">


      <!-- ODALAR -->

      <div class="rooms">

        <h3>Odalar</h3>


        <div
          class="room active"
          data-room="sohbet"
          onclick="changeRoom('sohbet', this)"
        >
          💬 Sohbet
        </div>


        <div
          class="room"
          data-room="Cinsellik"
          onclick="changeRoom('Cinsellik', this)"
        >
          🔥 Cinsellik
        </div>


        <div
          class="room"
          data-room="şarkı"
          onclick="changeRoom('şarkı', this)"
        >
          🎵 Şarkı
        </div>


        <div
          class="room"
          data-room="oyun"
          onclick="changeRoom('oyun', this)"
        >
          🎮 Oyun
        </div>


        <div
          class="room"
          data-room="yardım"
          onclick="changeRoom('yardım', this)"
        >
          🆘 Yardım
        </div>


        <div class="online">

          🟢 Online:
          <span id="onlineCount">0</span>

        </div>


        <button
          class="logout"
          onclick="logout()"
        >
          Çıkış Yap
        </button>

      </div>



      <!-- CHAT -->

      <div class="chat-box">


        <div
          id="chatHeader"
          class="chat-header"
        >
          💬 Sohbet
        </div>


        <div
          id="messages"
          class="messages"
        >

          <div class="empty">
            Mesajlar yükleniyor...
          </div>

        </div>


        <div class="chat-input">

          <input
            id="messageInput"
            type="text"
            placeholder="Mesajını yaz..."
            maxlength="500"
            autocomplete="off"
            onkeydown="handleEnter(event)"
          >

          <button
            class="send-btn"
            onclick="sendMessage()"
          >
            ➤
          </button>

        </div>


      </div>


    </div>

  </section>


</div>



<script>

/* =====================================
   SUPABASE AYARLARI
===================================== */

const SUPABASE_URL =
  "https://nlmdbqadvmpsbhlnniwx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Hmee-CUZQme2XLpTlRCrDw_eZnScubx";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =====================================
   DEĞİŞKENLER
===================================== */

let currentUsername = "";

let currentRoom = "sohbet";

let realtimeChannel = null;

let onlineInterval = null;



/* =====================================
   GİRİŞ
===================================== */

async function login(){

  const input =
    document.getElementById("username");

  const status =
    document.getElementById("loginStatus");

  const username =
    input.value.trim();


  if(!username){

    status.textContent =
      "Lütfen kullanıcı adı gir.";

    return;
  }


  if(username.length < 2){

    status.textContent =
      "Kullanıcı adı en az 2 karakter olmalı.";

    return;
  }


  status.textContent =
    "Giriş yapılıyor...";


  try{

    /* PROFİL OLUŞTUR */

    const profileResult =
      await supabaseClient
        .from("profiles")
        .upsert(
          {
            username: username
          },
          {
            onConflict: "username"
          }
        );


    if(profileResult.error){

      console.error(
        profileResult.error
      );

    }


    currentUsername =
      username;


    localStorage.setItem(
      "username",
      username
    );


    document.getElementById(
      "loginArea"
    ).style.display = "none";


    document.getElementById(
      "chatArea"
    ).style.display = "block";


    await joinOnline();


    await loadMessages();


    subscribeRealtime();


    startOnlineSystem();


    status.textContent = "";


  }catch(error){

    console.error(error);

    status.textContent =
      "Giriş sırasında hata oluştu.";

  }

}



/* =====================================
   ONLINE KULLANICI
===================================== */

async function joinOnline(){

  if(!currentUsername){
    return;
  }


  const result =
    await supabaseClient
      .from("online_users")
      .upsert(
        {
          username: currentUsername,
          room: currentRoom,
          created_at: new Date().toISOString()
        },
        {
          onConflict: "username"
        }
      );


  if(result.error){

    console.error(
      "Online kullanıcı hatası:",
      result.error
    );

  }


  await loadOnlineUsers();

}



/* =====================================
   ONLINE SİSTEMİ
===================================== */

function startOnlineSystem(){

  if(onlineInterval){

    clearInterval(
      onlineInterval
    );

  }


  onlineInterval =
    setInterval(
      async function(){

        if(!currentUsername){
          return;
        }


        await supabaseClient
          .from("online_users")
          .upsert(
            {
              username: currentUsername,
              room: currentRoom,
              created_at:
                new Date().toISOString()
            },
            {
              onConflict: "username"
            }
          );


        await cleanOldUsers();


        await loadOnlineUsers();

      },
      60000
    );

}



/* =====================================
   ESKİ ONLINE KULLANICILARI TEMİZLE
===================================== */

async function cleanOldUsers(){

  const oldTime =
    new Date(
      Date.now() - 5 * 60 * 1000
    ).toISOString();


  const result =
    await supabaseClient
      .from("online_users")
      .delete()
      .lt(
        "created_at",
        oldTime
      );


  if(result.error){

    console.error(
      result.error
    );

  }

}



/* =====================================
   ONLINE SAYISI
===================================== */

async function loadOnlineUsers(){

  const result =
    await supabaseClient
      .from("online_users")
      .select(
        "username",
        {
          count: "exact"
        }
      );


  if(result.error){

    console.error(
      result.error
    );

    return;
  }


  document.getElementById(
    "onlineCount"
  ).textContent =
    result.count || 0;

}



/* =====================================
   ODA DEĞİŞTİR
===================================== */

async function changeRoom(
  room,
  element
){

  currentRoom =
    room;


  document
    .querySelectorAll(".room")
    .forEach(
      function(item){

        item.classList.remove(
          "active"
        );

      }
    );


  element.classList.add(
    "active"
  );


  const roomNames = {

    sohbet:
      "💬 Sohbet",

    Cinsellik:
      "🔥 Cinsellik",

    şarkı:
      "🎵 Şarkı",

    oyun:
      "🎮 Oyun",

    yardım:
      "🆘 Yardım"

  };


  document.getElementById(
    "chatHeader"
  ).textContent =
    roomNames[room] || room;


  if(currentUsername){

    await supabaseClient
      .from("online_users")
      .upsert(
        {
          username:
            currentUsername,

          room:
            currentRoom,

          created_at:
            new Date().toISOString()
        },
        {
          onConflict:
            "username"
        }
      );

  }


  await loadMessages();

}



/* =====================================
   MESAJLARI YÜKLE
===================================== */

async function loadMessages(){

  const messages =
    document.getElementById(
      "messages"
    );


  messages.innerHTML = "";


  const result =
    await supabaseClient
      .from("messages")
      .select("*")
      .eq(
        "room",
        currentRoom
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      )
      .limit(200);


  if(result.error){

    console.error(
      result.error
    );


    messages.innerHTML = `

      <div class="empty">
        Mesajlar yüklenemedi.
      </div>

    `;

    return;
  }


  if(!result.data ||
     result.data.length === 0){

    messages.innerHTML = `

      <div class="empty">
        Bu odada henüz mesaj yok.
      </div>

    `;

    return;
  }


  result.data.forEach(
    function(item){

      addMessageToScreen(
        item
      );

    }
  );


  messages.scrollTop =
    messages.scrollHeight;

}



/* =====================================
   MESAJI EKRANA EKLE
===================================== */

function addMessageToScreen(
  data
){

  const messages =
    document.getElementById(
      "messages"
    );


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "name";

  name.textContent =
    data.username;


  const content =
    document.createElement(
      "div"
    );

  content.textContent =
    data.message;


  const time =
    document.createElement(
      "div"
    );

  time.className =
    "time";


  if(data.created_at){

    const date =
      new Date(
        data.created_at
      );


    time.textContent =
      date.toLocaleTimeString(
        "tr-TR",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

  }


  message.appendChild(
    name
  );


  message.appendChild(
    content
  );


  message.appendChild(
    time
  );


  messages.appendChild(
    message
  );

}



/* =====================================
   MESAJ GÖNDER
===================================== */

async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if(!text){

    return;
  }


  if(!currentUsername){

    alert(
      "Önce sohbete giriş yap."
    );

    return;
  }


  input.disabled =
    true;


  const result =
    await supabaseClient
      .from("messages")
      .insert(
        {
          username:
            currentUsername,

          message:
            text,

          room:
            currentRoom
        }
      );


  input.disabled =
    false;


  if(result.error){

    console.error(
      result.error
    );


    alert(
      "Mesaj gönderilemedi."
    );

    return;
  }


  input.value = "";

}



/* =====================================
   ENTER
===================================== */

function handleEnter(
  event
){

  if(
    event.key === "Enter"
  ){

    event.preventDefault();

    sendMessage();

  }

}



/* =====================================
   REALTIME
===================================== */

function subscribeRealtime(){

  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "chat-realtime"
      )


      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        function(payload){

          const newMessage =
            payload.new;


          if(
            newMessage.room ===
            currentRoom
          ){

            addMessageToScreen(
              newMessage
            );


            const messages =
              document.getElementById(
                "messages"
              );


            messages.scrollTop =
              messages.scrollHeight;

          }

        }
      )


      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "online_users"
        },
        function(){

          loadOnlineUsers();

        }
      )


      .subscribe();

}



/* =====================================
   ÇIKIŞ
===================================== */

async function logout(){

  if(currentUsername){

    await supabaseClient
      .from("online_users")
      .delete()
      .eq(
        "username",
        currentUsername
      );

  }


  if(onlineInterval){

    clearInterval(
      onlineInterval
    );

  }


  if(realtimeChannel){

    await supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  localStorage.removeItem(
    "username"
  );


  currentUsername = "";


  location.reload();

}



/* =====================================
   SAYFA AÇILIŞ
===================================== */

window.addEventListener(
  "load",
  async function(){

    const savedUsername =
      localStorage.getItem(
        "username"
      );


    if(savedUsername){

      currentUsername =
        savedUsername;


      document.getElementById(
        "loginArea"
      ).style.display = "none";


      document.getElementById(
        "chatArea"
      ).style.display = "block";


      await joinOnline();


      await loadMessages();


      subscribeRealtime();


      startOnlineSystem();

    }

  }
);



/* =====================================
   SAYFA KAPANIRKEN
===================================== */

window.addEventListener(
  "beforeunload",
  function(){

    if(currentUsername){

      supabaseClient
        .from("online_users")
        .delete()
        .eq(
          "username",
          currentUsername
        );

    }

  }
);

</script>


</body>
</html>
